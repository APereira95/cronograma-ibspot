name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4.2.2
      - name: Preparar la página
        run: |
          mkdir _site
          cp index.html _site/
      - name: Subir la página
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4.0.5
